<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Visa Documents</title>
<style>
:root{
  --bg:#eef1f8; --card:rgba(255,255,255,0.6); --cardsolid:#ffffff; --border:rgba(255,255,255,0.5); --hover:rgba(255,255,255,0.5);
  --text:#20201d; --text-secondary:#5c584f; --text-muted:#8a867a;
  --navy:#1c2b3a; --green:#0f6e56; --green-bg:rgba(15,110,86,0.14);
  --blue:#185fa5; --pink:#993556; --orange:#993c1d; --gray:#5f5e5a;
  --active:rgba(15,110,86,0.14);
}
/* Always a light, white-first glass look — matches the Gmail reference regardless of device theme. */
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:Roboto,Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#dbe7f5 0%,#eef1f8 35%,#f3e6ec 100%);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.glass{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--border);}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.header{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  color:var(--text);padding:8px 14px;flex:0 0 auto;border-bottom:1px solid var(--border);box-shadow:0 1px 12px rgba(30,40,70,0.06);
  padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;z-index:2;}
.hbtn{background:none;border:none;font-size:18px;color:var(--text-secondary);cursor:pointer;padding:4px;border-radius:50%;}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#185fa5,#0f6e56,#993556);
  display:flex;align-items:center;justify-content:center;font-size:14px;}
.search{flex:1;max-width:520px;display:flex;align-items:center;background:var(--bg);border-radius:22px;
  padding:8px 14px;gap:8px;color:var(--text-muted);font-size:13.5px;}
.search input{border:none;background:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.header h1{font-size:14px;margin:0;font-weight:500;color:var(--text-secondary);}
.avatar-hdr{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.dlbtn{font-size:12.5px;padding:6px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.08);
  background:var(--green);color:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(30,40,70,0.1);white-space:nowrap;flex:0 0 auto;}
.dlbtn:disabled{opacity:.6;cursor:default;}
.progress{font-size:11px;color:var(--text-muted);}
.main{flex:1;display:grid;grid-template-columns:190px 280px 1fr;gap:12px;padding:12px;overflow:hidden;min-height:0;}
.sidebar{overflow-y:auto;padding:12px 8px;border-radius:16px;box-shadow:0 4px 20px rgba(30,40,70,0.05);}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
  padding:9px 16px;border-radius:14px;font-size:13.5px;color:var(--text);cursor:pointer;margin-bottom:2px;}
.cat.active{background:rgba(15,110,86,0.18);font-weight:700;color:var(--green);}
.cat .ic{font-size:15px;}
.cat .n{margin-left:auto;color:var(--text-muted);font-size:11px;font-weight:400;}
.cat.active .n{color:var(--green);}
.list-pane{overflow-y:auto;border-radius:16px;box-shadow:0 4px 20px rgba(30,40,70,0.05);}
.list-title{padding:12px 14px 6px;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--border);cursor:pointer;}
.row:first-of-type{border-top:none;}
.row:hover{background:rgba(15,110,86,0.06);}
.row.selected{background:var(--active);}
.row input[type=checkbox]{accent-color:var(--green);flex:0 0 auto;margin-top:3px;}
.row .av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.row .body{min-width:0;}
.row .who{font-size:11.5px;font-weight:700;display:block;}
.row .rt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.row .rn{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px;}
.row.done .rt{text-decoration:line-through;color:var(--text-muted);font-weight:400;}
.row .clip{margin-left:auto;font-size:13px;color:var(--green);flex:0 0 auto;}
.reader-pane{overflow-y:auto;padding:18px;border-radius:16px;box-shadow:0 4px 20px rgba(30,40,70,0.05);}
.reader-pane .empty{color:var(--text-muted);font-size:13px;padding:40px 0;text-align:center;}
.r-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.r-note{font-size:13px;color:var(--text-secondary);margin-bottom:14px;}
.upload-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.btn{font-size:12.5px;border:1px solid rgba(0,0,0,0.08);padding:6px 12px;border-radius:10px;cursor:pointer;
  background:var(--cardsolid);color:var(--text);box-shadow:0 1px 4px rgba(30,40,70,0.06);}
.btn input[type=file]{display:none;}
.viewer{border:1px solid var(--border);border-radius:10px;overflow:auto;background:rgba(255,255,255,0.4);
  max-height:60vh;text-align:center;touch-action:pinch-zoom;}
.sample{background:var(--cardsolid);border:1px solid rgba(0,0,0,0.08);border-radius:12px;padding:12px;margin-bottom:14px;}
.sample .lbl{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:block;}
.sample textarea{width:100%;min-height:220px;border:none;background:none;font-family:Georgia,'Times New Roman',serif;
  font-size:13px;line-height:1.6;color:var(--text);resize:vertical;outline:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.fchip{font-size:12px;background:var(--cardsolid);border:1px solid rgba(0,0,0,0.08);border-radius:20px;
  padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.fchip.sel{border-color:var(--green);color:var(--green);font-weight:600;}
.fchip button{border:none;background:rgba(0,0,0,0.06);border-radius:50%;width:18px;height:18px;cursor:pointer;
  color:inherit;font-size:13px;line-height:1;}
.viewer img{max-width:none;transform-origin:top left;transition:transform .1s;}
.zoombar{display:flex;gap:8px;margin:10px 0;}
.warn{font-size:12px;color:var(--orange);margin-top:6px;}
.backbtn{display:none;background:none;border:none;color:var(--text);font-size:16px;cursor:pointer;padding:0 4px;}
@media (max-width:900px){
  .main{grid-template-columns:1fr;}
  .sidebar,.list-pane,.reader-pane{display:none;grid-column:1;}
  .main[data-view="cats"] .sidebar{display:block;}
  .main[data-view="list"] .list-pane{display:block;}
  .main[data-view="reader"] .reader-pane{display:block;}
  .backbtn{display:inline-block;}
  .hbtn,.search,.avatar-hdr{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="backbtn" id="backBtn">←</button>
    <button class="hbtn">☰</button>
    <div class="logo"><span class="dot">👪</span><span id="headerTitle">Family Docs</span></div>
    <div class="search"><span>🔍</span><input id="searchInput" placeholder="Search documents"></div>
    <span class="progress" id="progressLabel"></span>
    <div class="avatar-hdr">A</div>
    <button class="dlbtn" id="dlAllBtn">⬇ PDF</button>
  </div>
  <div class="main" id="main" data-view="cats">
    <div class="sidebar glass" id="sidebar"></div>
    <div class="list-pane glass" id="listPane"></div>
    <div class="reader-pane glass" id="readerPane"><div class="empty">Select a document to view it here.</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const WHO_COLOR = { Ayesha:"var(--pink)", Abdullah:"var(--blue)", Airah:"var(--orange)", Both:"var(--gray)" };
const CAT_ICON = { app:"📝", id:"🪪", child:"👶", rel:"💍", fin:"💰", other:"📁" };

const DATA = [
  { id:"app", title:"Application & Fee", items:[
    {id:"a1", t:"Signed, dated printed AVATS summary form", who:"Ayesha", n:"Print exactly what the online system generates — sign by hand."},
    {id:"a2", t:"Visa fee paid (or exemption confirmed)", who:"Abdullah", n:"Check current fee table — some family members are fee-exempt."}
  ]},
  { id:"id", title:"Identity Documents", items:[
    {id:"i1", t:"Airah's current passport", who:"Airah", n:"Valid at least 12 months after arrival.", have:true},
    {id:"i2", t:"2 colour passport photos of Airah", who:"Airah", n:"Under 6 months old; name + visa ref number on back."},
    {id:"i3", t:"Copy of Abdullah's passport — all pages", who:"Abdullah", n:"Include stamps/visas, not just photo page."},
    {id:"i4", t:"Copy of Abdullah's Irish Residence Permit (Stamp 4)", who:"Abdullah", n:""}
  ]},
  { id:"child", title:"Child-Specific", items:[
    {id:"c1", t:"Airah's original birth certificate", who:"Ayesha", n:"Attested/apostilled by MOFA, plus certified English translation.", have:true},
    {id:"c2", t:"Signed consent letter from Abdullah", who:"Abdullah", n:"Needed since Ayesha brings Airah to appointment. Include copy of his passport/ID showing signature.",
     sample:"[Abdullah's full name]\n[Abdullah's address in Ireland]\n[Phone / email]\n[Date]\n\nTo: The Visa Officer, VFS Global / Irish Embassy, Islamabad\nRe: Consent for daughter's Join Family Visa application — [Airah's full name]\n\nI, [Abdullah's full name], holder of Irish Residence Permit (Stamp 4) number [xxx] and Pakistani passport number [xxx], residing at [address in Ireland], am the father of [Airah's full name], born on [date of birth] in [place of birth], holder of Pakistani passport number [xxx].\n\nI hereby give my full consent for my daughter's mother, [Ayesha's full name], to bring our daughter to the VFS Global visa application centre in Lahore to submit her application for an Ireland Join Family Visa, and to travel with her to Ireland upon approval.\n\nI confirm that I am the sponsor of this application and that the financial and residency documents submitted in support of it are accurate.\n\nSigned: ___________________\n[Abdullah's full name]\nDate: ___________________\n\n(Attach a copy of a passport/ID page clearly showing this signature.)"}
  ]},
  { id:"rel", title:"Relationship Evidence", items:[
    {id:"r1", t:"Marriage certificate (copy)", who:"Both", n:"Apostilled + translated if not in English."},
    {id:"r2", t:"Signed letter of application", who:"Ayesha", n:"Contact details, reason, Abdullah as sponsor, other family in Ireland/UK/EU.",
     sample:"[Ayesha's full name]\n[Ayesha's address in Pakistan]\n[Phone / email]\n[Date]\n\nTo: The Visa Officer, VFS Global / Irish Embassy, Islamabad\nRe: Letter of Application — Join Family Visa for [Airah's full name]\n\nI, [Ayesha's full name], am the mother of [Airah's full name], born [date of birth] in [place of birth]. I am submitting this application on her behalf to join her father, [Abdullah's full name], who resides in Ireland under Stamp 4 permission at [address in Ireland].\n\n[Abdullah's full name] and I have been married since [marriage date] in [place]; a copy of our marriage certificate is enclosed. [Abdullah's full name] is settled and employed in Ireland and wishes for our daughter to join him there as a family.\n\nTo my knowledge, no other family members are currently residing in Ireland, the UK, or the EU. [— edit if not accurate]\n\nI confirm that all information and documents provided in support of this application are true and correct to the best of my knowledge.\n\nSigned: ___________________\n[Ayesha's full name]\nDate: ___________________"}
  ]},
  { id:"fin", title:"Financial Evidence", items:[
    {id:"f1", t:"6-month official bank statement", who:"Abdullah", n:"Detailed transactions, not just balance — 6 months before application."},
    {id:"f2", t:"Employment Detail Summary + 3 recent payslips", who:"Abdullah", n:"Shows income above threshold for one child."}
  ]},
  { id:"other", title:"Other", items:[
    {id:"o1", t:"Details of any previous visa refusals", who:"Both", n:"Include original refusal letter if applicable."},
    {id:"o2", t:"Medical/travel insurance", who:"Ayesha", n:"Not needed at submission, have ready before travel."}
  ]}
];

const KEY = "familyVisaDocs_v3";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
// migrate from the old single-file format, and from the pre-v3 storage key
if (!state.__migratedV3) {
  try {
    const old = JSON.parse(localStorage.getItem("familyVisaDocs_v2") || "{}");
    Object.keys(old).forEach(id => {
      if (id.startsWith("__")) return;
      if (!state[id]) state[id] = {};
      if (old[id].checked) state[id].checked = old[id].checked;
      if (old[id].file && !state[id].files) state[id].files = [old[id].file];
    });
  } catch(e) {}
  state.__migratedV3 = true;
}
if (!state.__seeded) {
  DATA.forEach(sec => sec.items.forEach(it => { if (it.have) state[it.id] = { ...(state[it.id]||{}), checked:true }; }));
  state.__seeded = true;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ alert("Could not save — storage may be full."); } }

let activeCat = DATA[0].id;
let activeItem = null;
let previewIdx = 0;
let zoom = 1;
const isMobile = () => window.innerWidth <= 900;

function counts(sec){
  const total = sec.items.length;
  const done = sec.items.filter(it => state[it.id] && state[it.id].checked).length;
  return {total, done};
}
function findItem(id){ for (const s of DATA) for (const it of s.items) if (it.id===id) return it; }

function renderSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = DATA.map(sec => {
    const {total,done} = counts(sec);
    return `<button class="cat ${sec.id===activeCat?'active':''}" data-cat="${sec.id}"><span class="ic">${CAT_ICON[sec.id]}</span>${sec.title}<span class="n">${done}/${total}</span></button>`;
  }).join("");
  el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    activeCat = b.getAttribute('data-cat'); activeItem=null;
    setView('list'); renderAll();
  });
}

function rowHtml(it){
  const st = state[it.id]||{};
  return `<div class="row ${st.checked?'done':''} ${it.id===activeItem?'selected':''}" data-item="${it.id}">
    <input type="checkbox" data-check="${it.id}" ${st.checked?'checked':''}>
    <div class="av" style="background:${WHO_COLOR[it.who]}">${it.who[0]}</div>
    <div class="body">
      <span class="who" style="color:${WHO_COLOR[it.who]}">${it.who}</span>
      <span class="rt">${it.t}</span>
      ${it.n?`<span class="rn">${it.n}</span>`:''}
    </div>
    ${st.files&&st.files.length?`<span class="clip">📎${st.files.length>1?st.files.length:''}</span>`:''}
  </div>`;
}

function renderList(){
  const el = document.getElementById("listPane");
  const q = (document.getElementById('searchInput')||{}).value?.trim().toLowerCase();
  if (q){
    const matches = [];
    DATA.forEach(sec => sec.items.forEach(it => { if (it.t.toLowerCase().includes(q)) matches.push(it); }));
    el.innerHTML = `<div class="list-title">Search results</div>` +
      (matches.length ? matches.map(rowHtml).join("") : `<div class="empty">No documents match "${q}".</div>`);
  } else {
    const sec = DATA.find(s=>s.id===activeCat);
    el.innerHTML = `<div class="list-title">${sec.title}</div>` + sec.items.map(rowHtml).join("");
  }
  el.querySelectorAll('[data-item]').forEach(r=>r.addEventListener('click',(e)=>{
    if (e.target.matches('[data-check]')) return;
    activeItem = r.getAttribute('data-item'); zoom=1; previewIdx=0;
    setView('reader'); renderAll();
  }));
  el.querySelectorAll('[data-check]').forEach(cb=>cb.addEventListener('change',()=>{
    const id = cb.getAttribute('data-check');
    state[id] = state[id]||{}; state[id].checked = cb.checked;
    save(); renderAll();
  }));
}

function renderReader(){
  const el = document.getElementById("readerPane");
  if (!activeItem){ el.innerHTML = '<div class="empty">Select a document to view it here.</div>'; return; }
  const it = findItem(activeItem);
  const st = state[activeItem]||{};
  const files = st.files||[];
  if (previewIdx >= files.length) previewIdx = 0;
  const chipsHtml = files.map((f,i)=>`<span class="fchip ${i===previewIdx?'sel':''}" data-preview="${i}">
      ${f.name}<button data-rm="${i}" title="Remove">×</button></span>`).join("");
  const cur = files[previewIdx];
  let viewerHtml = "";
  if (cur){
    if (cur.type && cur.type.startsWith("image/")){
      viewerHtml = `<div class="zoombar">
        <button class="btn" id="zOut">−</button>
        <button class="btn" id="zReset">Reset</button>
        <button class="btn" id="zIn">+</button>
      </div>
      <div class="viewer" id="imgWrap"><img id="zImg" src="${cur.data}"></div>`;
    } else {
      viewerHtml = `<a class="btn" href="${cur.data}" download="${cur.name}" target="_blank">Open ${cur.name}</a>`;
    }
  }
  const sampleHtml = it.sample ? `<div class="sample"><span class="lbl">Draft letter — fill in, print & sign</span>
    <textarea readonly>${it.sample}</textarea></div>` : "";
  const multiNote = files.length>1 ? `<div class="warn" style="color:var(--green);">${files.length} files attached — all will be combined together, in this order, in "Download all as PDF".</div>` : "";
  el.innerHTML = `
    <h2 class="r-title">${it.t}</h2>
    <div class="r-note"><span style="color:${WHO_COLOR[it.who]};font-weight:700;">${it.who}</span> — ${it.n||''}</div>
    ${sampleHtml}
    <div class="upload-row">
      <label class="btn">Upload<input type="file" id="upInput" accept="image/*,.pdf" multiple></label>
    </div>
    ${files.length?`<div class="chips">${chipsHtml}</div>`:''}
    ${multiNote}
    <div class="warn" id="warnMsg" style="display:none;"></div>
    ${viewerHtml}
  `;
  const upInput = document.getElementById('upInput');
  if (upInput) upInput.addEventListener('change',(e)=>{
    const picked = Array.from(e.target.files);
    if (!picked.length) return;
    const warn = document.getElementById('warnMsg');
    const big = picked.filter(f=>f.size > 2*1024*1024);
    if (big.length){ warn.style.display='block'; warn.textContent = big.map(f=>f.name).join(', ') + ' — over 2MB, may fail to save.'; }
    else warn.style.display='none';
    Promise.all(picked.map(file => new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res({name:file.name, type:file.type, data:r.result});
      r.onerror = rej;
      r.readAsDataURL(file);
    }))).then(newFiles=>{
      state[activeItem] = state[activeItem]||{};
      state[activeItem].files = (state[activeItem].files||[]).concat(newFiles);
      previewIdx = state[activeItem].files.length - 1;
      save(); renderAll();
    }).catch(()=>{ warn.style.display='block'; warn.textContent='Could not read one of those files.'; });
  });
  el.querySelectorAll('[data-preview]').forEach(c=>c.addEventListener('click',(e)=>{
    if (e.target.matches('[data-rm]')) return;
    previewIdx = parseInt(c.getAttribute('data-preview'),10); zoom=1; renderReader();
  }));
  el.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    const i = parseInt(b.getAttribute('data-rm'),10);
    state[activeItem].files.splice(i,1);
    previewIdx = 0;
    save(); renderAll();
  }));
  const zImg = document.getElementById('zImg');
  if (zImg){
    document.getElementById('zIn').onclick=()=>{ zoom=Math.min(zoom+0.25,4); zImg.style.transform=`scale(${zoom})`; };
    document.getElementById('zOut').onclick=()=>{ zoom=Math.max(zoom-0.25,0.5); zImg.style.transform=`scale(${zoom})`; };
    document.getElementById('zReset').onclick=()=>{ zoom=1; zImg.style.transform='scale(1)'; };
  }
}

function renderProgress(){
  const v = document.getElementById("main").getAttribute('data-view');
  if (v==='list' || v==='reader'){
    const {total,done} = counts(DATA.find(s=>s.id===activeCat));
    document.getElementById("progressLabel").textContent = `${done}/${total}`;
  } else {
    let total=0, done=0;
    DATA.forEach(sec=>{ const c=counts(sec); total+=c.total; done+=c.done; });
    document.getElementById("progressLabel").textContent = `${done}/${total} overall`;
  }
}

function setView(v){
  document.getElementById("main").setAttribute('data-view', v);
  document.getElementById("headerTitle").textContent =
    v==='cats' ? 'Ireland Join Family Visa' :
    v==='list' ? DATA.find(s=>s.id===activeCat).title :
    (activeItem ? findItem(activeItem).t : 'Family Docs');
  renderProgress();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  const v = document.getElementById("main").getAttribute('data-view');
  if (v==='reader') setView('list');
  else if (v==='list') setView('cats');
});

function renderAll(){ renderSidebar(); renderList(); renderReader(); renderProgress(); }
setView(isMobile() ? 'cats' : 'reader');
renderAll();
document.getElementById('searchInput').addEventListener('input', ()=>{
  if (isMobile()) setView('list');
  renderList();
});

async function downloadAllPdf(){
  const btn = document.getElementById('dlAllBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Building…';
  try {
    if (!window.PDFLib) throw new Error('PDF library did not load — check your connection and try again.');
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const merged = await PDFDocument.create();
    const font = await merged.embedFont(StandardFonts.HelveticaBold);
    let count = 0; const missing = [];
    for (const sec of DATA){
      for (const it of sec.items){
        const files = (state[it.id]||{}).files || [];
        if (!files.length){ missing.push(it.t); continue; }
        const label = merged.addPage([595,120]);
        label.drawText(sec.title.toUpperCase(), {x:40,y:80,size:11,font,color:rgb(0.36,0.34,0.31)});
        label.drawText(`${it.t} \u2014 ${it.who}${files.length>1?` (${files.length} files combined)`:''}`,
          {x:40,y:50,size:13,font,color:rgb(0.13,0.13,0.11)});
        let added = false;
        for (const f of files){
          const buf = await (await fetch(f.data)).arrayBuffer();
          const type = f.type || '';
          if (type === 'application/pdf'){
            const src = await PDFDocument.load(buf);
            const pages = await merged.copyPages(src, src.getPageIndices());
            pages.forEach(p=>merged.addPage(p));
            added = true;
          } else if (type.includes('png') || type.includes('jpeg') || type.includes('jpg')){
            const img = type.includes('png') ? await merged.embedPng(buf) : await merged.embedJpg(buf);
            const scale = Math.min(595/img.width, 842/img.height, 1);
            const w = img.width*scale, h = img.height*scale;
            const page = merged.addPage([595,842]);
            page.drawImage(img, {x:(595-w)/2, y:(842-h)/2, width:w, height:h});
            added = true;
          } else {
            missing.push(`${f.name} (unsupported type — re-upload as JPG, PNG or PDF)`);
          }
        }
        if (added) count++;
      }
    }
    if (count===0){ alert('No documents uploaded yet — upload files first, then try again.'); return; }
    const bytes = await merged.save();
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Family-Visa-Documents.pdf'; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if (missing.length) alert('Downloaded ' + count + ' document(s).\n\nNot included (not uploaded yet):\n' + missing.join('\n'));
  } catch(err){
    alert('Could not build the PDF: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}
document.getElementById('dlAllBtn').addEventListener('click', downloadAllPdf);
</script>
</body>
</html>
