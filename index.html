<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Visa Documents</title>
<style>
:root{
  --bg:#edf4ff;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.72);
  --text:#142033;
  --text-secondary:#536176;
  --text-muted:#8793a5;
  --green:#0c8b72;
  --green-2:#20b892;
  --blue:#3d72f6;
  --purple:#8a5cf6;
  --pink:#d65087;
  --orange:#e66c3a;
  --gray:#667085;
  --shadow:0 18px 55px rgba(43,63,104,.14);
  --shadow-soft:0 8px 28px rgba(43,63,104,.09);
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  font-family:Inter,Roboto,Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 10%,rgba(82,151,255,.34),transparent 30%),
    radial-gradient(circle at 88% 14%,rgba(160,102,255,.28),transparent 29%),
    radial-gradient(circle at 70% 88%,rgba(39,194,155,.25),transparent 33%),
    linear-gradient(135deg,#e8f1ff 0%,#f5f3ff 46%,#eefaf7 100%);
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before,body::after{
  content:"";position:fixed;z-index:-1;border-radius:999px;filter:blur(14px);pointer-events:none;
}
body::before{width:340px;height:340px;left:-100px;bottom:-100px;background:rgba(72,123,255,.18)}
body::after{width:300px;height:300px;right:-80px;top:22%;background:rgba(167,87,255,.13)}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(155%);
  backdrop-filter:blur(24px) saturate(155%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft);
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.header{
  margin:14px 14px 0;
  min-height:66px;
  padding:10px 14px;
  display:flex;align-items:center;gap:12px;flex:0 0 auto;
  background:rgba(255,255,255,.68);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.82);
  border-radius:20px;
  box-shadow:var(--shadow-soft);
  z-index:20;
}
.hbtn,.backbtn{
  width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.72);color:var(--text-secondary);
  display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(80,100,140,.08);
}
.hbtn:hover,.backbtn:hover{background:#fff;transform:translateY(-1px)}
.backbtn{display:none;font-size:18px}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--text);white-space:nowrap;min-width:0}
.logo .dot{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple) 52%,var(--green-2));display:grid;place-items:center;font-size:18px;box-shadow:0 9px 24px rgba(77,95,226,.26)}
#headerTitle{overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:660px;display:flex;align-items:center;background:rgba(244,248,255,.82);border:1px solid rgba(97,119,159,.09);border-radius:15px;padding:10px 14px;gap:9px;color:var(--text-muted);font-size:13.5px;transition:.2s ease}
.search:focus-within{background:#fff;border-color:rgba(61,114,246,.26);box-shadow:0 0 0 4px rgba(61,114,246,.07)}
.search input{border:0;background:transparent;outline:0;color:var(--text);font-size:13.5px;width:100%;min-width:0}
.progress{font-size:12px;color:var(--text-secondary);font-weight:700;background:rgba(255,255,255,.72);padding:7px 9px;border-radius:10px;white-space:nowrap}
.avatar-hdr{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--green),#35b9a0);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 20px rgba(12,139,114,.2)}
.dlbtn{font-size:12.5px;font-weight:800;padding:10px 14px;border-radius:13px;border:0;background:linear-gradient(135deg,#0c8b72,#20b892);color:#fff;cursor:pointer;box-shadow:0 9px 22px rgba(12,139,114,.22);white-space:nowrap}
.dlbtn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(12,139,114,.28)}
.dlbtn:disabled{opacity:.6;cursor:default;transform:none}
.main{flex:1;display:grid;grid-template-columns:minmax(210px,240px) minmax(300px,360px) minmax(0,1fr);gap:14px;padding:14px;overflow:hidden;min-height:0}
.sidebar,.list-pane,.reader-pane{border-radius:24px;min-height:0;overflow:auto}
.sidebar{padding:14px}
.summary-card{padding:16px;border-radius:18px;margin-bottom:12px;background:linear-gradient(135deg,rgba(61,114,246,.12),rgba(138,92,246,.09),rgba(32,184,146,.11));border:1px solid rgba(255,255,255,.7)}
.summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.summary-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:800;color:var(--text-muted)}
.summary-title{font-size:17px;font-weight:850;margin-top:3px}
.summary-value{font-size:22px;font-weight:850;color:var(--green)}
.summary-bar{height:7px;background:rgba(255,255,255,.8);border-radius:999px;overflow:hidden;margin-top:12px}
.summary-bar>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--purple),var(--green-2));transition:width .3s ease}
.cat{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;padding:11px 12px;border-radius:15px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:4px;transition:.18s ease}
.cat:hover{background:rgba(255,255,255,.5);color:var(--text)}
.cat.active{background:linear-gradient(135deg,rgba(12,139,114,.16),rgba(61,114,246,.10));font-weight:800;color:var(--green);box-shadow:inset 0 0 0 1px rgba(12,139,114,.08)}
.cat .ic{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.72);font-size:15px;box-shadow:0 4px 14px rgba(58,77,120,.07)}
.cat .n{margin-left:auto;color:var(--text-muted);font-size:10.5px;font-weight:800;background:rgba(255,255,255,.63);padding:4px 6px;border-radius:8px}.cat.active .n{color:var(--green)}
.list-pane{padding:10px}
.list-head{padding:8px 8px 10px}
.list-title{padding:0;font-size:11px;font-weight:850;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.mini-progress{height:5px;background:rgba(255,255,255,.72);border-radius:999px;overflow:hidden;margin-top:9px}.mini-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green-2));border-radius:999px}
.row{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid transparent;border-radius:16px;cursor:pointer;margin:3px 0;transition:.18s ease}
.row:hover{background:rgba(255,255,255,.58);border-color:rgba(255,255,255,.7);transform:translateY(-1px)}
.row.selected{background:rgba(255,255,255,.82);border-color:rgba(61,114,246,.16);box-shadow:0 8px 22px rgba(48,70,115,.09)}
.row input[type=checkbox]{accent-color:var(--green);flex:0 0 auto;margin-top:6px;width:16px;height:16px}
.row .av{width:34px;height:34px;border-radius:12px;color:#fff;font-size:12.5px;font-weight:850;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 16px rgba(30,50,80,.12)}
.row .body{min-width:0;flex:1}.row .who{font-size:10.5px;font-weight:850;display:block;margin-bottom:2px}.row .rt{font-size:13px;font-weight:760;line-height:1.25;display:block}.row .rn{font-size:11.5px;color:var(--text-secondary);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}.row.done .rt{color:#617082}.row .clip{margin-left:auto;font-size:11px;color:var(--green);font-weight:800;background:rgba(12,139,114,.10);padding:5px 7px;border-radius:9px;white-space:nowrap}
.reader-pane{padding:22px}.reader-pane .empty{color:var(--text-muted);font-size:13px;padding:80px 20px;text-align:center}.empty-icon{font-size:34px;display:block;margin-bottom:10px;opacity:.75}
.reader-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}.r-title{font-size:21px;line-height:1.15;font-weight:850;margin:0 0 6px}.r-note{font-size:12.5px;line-height:1.45;color:var(--text-secondary)}
.owner-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:850;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.68);white-space:nowrap}
.upload-zone{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border-radius:18px;border:1px dashed rgba(61,114,246,.30);background:linear-gradient(135deg,rgba(61,114,246,.08),rgba(138,92,246,.06));margin:14px 0}.upload-copy{min-width:0}.upload-title{font-size:13px;font-weight:850}.upload-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;border:1px solid rgba(67,90,130,.10);padding:8px 11px;border-radius:11px;cursor:pointer;background:rgba(255,255,255,.86);color:var(--text);box-shadow:0 5px 14px rgba(30,50,85,.06);text-decoration:none}.btn:hover{background:#fff;transform:translateY(-1px)}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 18px rgba(73,88,225,.22)}.btn input[type=file]{display:none}
.sample{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.82);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow-soft)}.sample .lbl{font-size:10.5px;font-weight:850;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:block}.sample textarea{width:100%;min-height:220px;border:0;background:transparent;font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.6;color:var(--text);resize:vertical;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}.fchip{font-size:11.5px;background:rgba(255,255,255,.72);border:1px solid rgba(76,97,138,.10);border-radius:999px;padding:6px 7px 6px 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:100%}.fchip.sel{border-color:rgba(12,139,114,.36);background:rgba(12,139,114,.08);color:var(--green);font-weight:800}.fchip button{border:0;background:rgba(20,35,60,.07);border-radius:50%;width:19px;height:19px;cursor:pointer;color:inherit;font-size:13px;line-height:1}
.viewer{border:1px solid rgba(255,255,255,.8);border-radius:18px;overflow:auto;background:rgba(255,255,255,.48);max-height:58vh;text-align:center;touch-action:pinch-zoom;box-shadow:var(--shadow-soft)}.viewer img{max-width:none;transform-origin:top left;transition:transform .1s}.pdf-view{width:100%;min-height:560px;border:0;background:#fff}.file-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:rgba(255,255,255,.67);border:1px solid rgba(255,255,255,.78)}.file-icon{font-size:28px}.file-meta{flex:1;min-width:0}.file-name{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-type{font-size:11px;color:var(--text-muted);margin-top:2px}
.zoombar{display:flex;gap:8px;margin:10px 0}.warn{font-size:11.5px;color:var(--orange);margin:8px 0}.saved-note{font-size:11.5px;color:var(--green);font-weight:700;margin:8px 0}
@media (max-width:1100px){.main{grid-template-columns:200px 300px minmax(0,1fr)}.reader-pane{padding:18px}.r-title{font-size:18px}}
@media (max-width:900px){
  body{overflow:auto;background:linear-gradient(160deg,#e8f1ff 0%,#f4efff 48%,#effaf6 100%)}
  .app{min-height:100dvh;height:auto}.header{position:sticky;top:0;margin:8px 8px 0;min-height:60px;padding:9px 10px;border-radius:18px}.main{display:grid;grid-template-columns:1fr;gap:0;padding:8px;overflow:visible;min-height:calc(100dvh - 76px)}
  .sidebar,.list-pane,.reader-pane{display:none;grid-column:1;border-radius:20px;min-height:calc(100dvh - 84px);overflow:visible}.main[data-view="cats"] .sidebar{display:block}.main[data-view="list"] .list-pane{display:block}.main[data-view="reader"] .reader-pane{display:block}.backbtn{display:grid}.hbtn,.search,.avatar-hdr{display:none}.logo{flex:1}.logo .dot{width:34px;height:34px;border-radius:11px}.progress{font-size:10.5px;padding:6px 7px}.dlbtn{padding:8px 10px;font-size:11px}.sidebar{padding:12px}.summary-card{padding:15px}.cat{padding:12px;margin-bottom:5px}.list-pane{padding:8px}.row{padding:12px 10px}.reader-pane{padding:16px}.reader-head{display:block}.owner-pill{margin-top:10px}.upload-zone{align-items:flex-start;flex-direction:column}.upload-zone .btn{width:100%}.pdf-view{min-height:68vh}.viewer{max-height:70vh}.sample textarea{min-height:300px}.r-title{font-size:19px}
}
@media (max-width:430px){.header{gap:8px}.dlbtn{padding:8px 9px}.progress{display:none}.logo{font-size:13px}.reader-pane{padding:14px}.row .rn{-webkit-line-clamp:3}}

/* Shared Google Drive login */
.auth-overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,rgba(61,114,246,.35),transparent 32%),radial-gradient(circle at 85% 85%,rgba(32,184,146,.25),transparent 30%),rgba(234,241,255,.78);backdrop-filter:blur(24px)}
.auth-overlay.hidden{display:none}.auth-card{width:min(430px,100%);padding:28px;border-radius:26px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);box-shadow:0 28px 80px rgba(42,58,100,.20)}.auth-logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,var(--blue),var(--purple),var(--green-2));margin-bottom:16px}.auth-card h2{margin:0 0 6px;font-size:24px}.auth-card p{margin:0 0 18px;color:var(--text-secondary);font-size:13px}.auth-field{display:block;margin:11px 0}.auth-field span{display:block;font-size:11px;font-weight:800;color:var(--text-muted);margin:0 0 6px}.auth-field select,.auth-field input{width:100%;border:1px solid rgba(60,80,120,.12);background:rgba(255,255,255,.84);padding:12px 13px;border-radius:13px;outline:none;color:var(--text)}.auth-field input:focus,.auth-field select:focus{border-color:rgba(61,114,246,.35);box-shadow:0 0 0 4px rgba(61,114,246,.08)}.auth-submit{width:100%;margin-top:8px;padding:12px 15px;border:0;border-radius:13px;color:#fff;font-weight:850;background:linear-gradient(135deg,var(--blue),var(--purple));cursor:pointer}.auth-error{min-height:18px;font-size:12px;color:var(--orange);margin-top:10px}.cloud-status{font-size:11px;font-weight:750;color:var(--green);white-space:nowrap}.cloud-status.bad{color:var(--orange)}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">👪</div>
    <h2>Family Visa Documents</h2>
    <p>Sign in to see the shared Google Drive documents.</p>
    <label class="auth-field"><span>WHO ARE YOU?</span><select id="loginUser"><option>Abdullah</option><option>Ayesha</option></select></label>
    <label class="auth-field"><span>PASSWORD</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password"></label>
    <button class="auth-submit" id="loginBtn">Sign in</button>
    <div class="auth-error" id="loginError"></div>
  </div>
</div>
<div class="app">
  <div class="header">
    <button class="backbtn" id="backBtn">←</button>
    <button class="hbtn">☰</button>
    <div class="logo"><span class="dot">👪</span><span id="headerTitle">Family Docs</span></div>
    <div class="search"><span>🔍</span><input id="searchInput" placeholder="Search documents"></div>
    <span class="progress" id="progressLabel"></span>
    <span class="cloud-status" id="cloudStatus">☁ Shared</span><div class="avatar-hdr" id="avatarHdr">A</div>
    <button class="dlbtn" id="dlAllBtn">⬇ PDF</button>
  </div>
  <div class="main" id="main" data-view="cats">
    <div class="sidebar glass" id="sidebar"></div>
    <div class="list-pane glass" id="listPane"></div>
    <div class="reader-pane glass" id="readerPane"><div class="empty"><span class="empty-icon">📄</span><strong>Select a document</strong><br>Upload, preview and organise each item here.</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const WHO_COLOR = { Ayesha:"var(--pink)", Abdullah:"var(--blue)", Airah:"var(--orange)", Both:"var(--gray)" };
const CAT_ICON = { app:"📝", id:"🪪", child:"👶", rel:"💍", fin:"💰", other:"📁" };

const DATA = [
  { id:"app", title:"Application & Fee", items:[
    {id:"a1", t:"Signed, dated printed AVATS summary form", who:"Ayesha", n:"Print exactly what the online system generates — sign by hand."},
    {id:"a2", t:"Visa fee paid (or exemption confirmed)", who:"Abdullah", n:"Check current fee table — some family members are fee-exempt."}
  ]},
  { id:"id", title:"Identity Documents", items:[
    {id:"i1", t:"Airah's current passport", who:"Airah", n:"Valid at least 12 months after arrival.", have:true},
    {id:"i2", t:"2 colour passport photos of Airah", who:"Airah", n:"Under 6 months old; name + visa ref number on back."},
    {id:"i3", t:"Copy of Abdullah's passport — all pages", who:"Abdullah", n:"Include stamps/visas, not just photo page."},
    {id:"i4", t:"Copy of Abdullah's Irish Residence Permit (Stamp 4)", who:"Abdullah", n:""}
  ]},
  { id:"child", title:"Child-Specific", items:[
    {id:"c1", t:"Airah's original birth certificate", who:"Ayesha", n:"Attested/apostilled by MOFA, plus certified English translation.", have:true},
    {id:"c2", t:"Signed consent letter from Abdullah", who:"Abdullah", n:"Needed since Ayesha brings Airah to appointment. Include copy of his passport/ID showing signature.",
     sample:"[Abdullah's full name]\n[Abdullah's address in Ireland]\n[Phone / email]\n[Date]\n\nTo: The Visa Officer, VFS Global / Irish Embassy, Islamabad\nRe: Consent for daughter's Join Family Visa application — [Airah's full name]\n\nI, [Abdullah's full name], holder of Irish Residence Permit (Stamp 4) number [xxx] and Pakistani passport number [xxx], residing at [address in Ireland], am the father of [Airah's full name], born on [date of birth] in [place of birth], holder of Pakistani passport number [xxx].\n\nI hereby give my full consent for my daughter's mother, [Ayesha's full name], to bring our daughter to the VFS Global visa application centre in Lahore to submit her application for an Ireland Join Family Visa, and to travel with her to Ireland upon approval.\n\nI confirm that I am the sponsor of this application and that the financial and residency documents submitted in support of it are accurate.\n\nSigned: ___________________\n[Abdullah's full name]\nDate: ___________________\n\n(Attach a copy of a passport/ID page clearly showing this signature.)"}
  ]},
  { id:"rel", title:"Relationship Evidence", items:[
    {id:"r1", t:"Marriage certificate (copy)", who:"Both", n:"Apostilled + translated if not in English."},
    {id:"r2", t:"Signed letter of application", who:"Ayesha", n:"Contact details, reason, Abdullah as sponsor, other family in Ireland/UK/EU.",
     sample:"[Ayesha's full name]\n[Ayesha's address in Pakistan]\n[Phone / email]\n[Date]\n\nTo: The Visa Officer, VFS Global / Irish Embassy, Islamabad\nRe: Letter of Application — Join Family Visa for [Airah's full name]\n\nI, [Ayesha's full name], am the mother of [Airah's full name], born [date of birth] in [place of birth]. I am submitting this application on her behalf to join her father, [Abdullah's full name], who resides in Ireland under Stamp 4 permission at [address in Ireland].\n\n[Abdullah's full name] and I have been married since [marriage date] in [place]; a copy of our marriage certificate is enclosed. [Abdullah's full name] is settled and employed in Ireland and wishes for our daughter to join him there as a family.\n\nTo my knowledge, no other family members are currently residing in Ireland, the UK, or the EU. [— edit if not accurate]\n\nI confirm that all information and documents provided in support of this application are true and correct to the best of my knowledge.\n\nSigned: ___________________\n[Ayesha's full name]\nDate: ___________________"}
  ]},
  { id:"fin", title:"Financial Evidence", items:[
    {id:"f1", t:"6-month official bank statement", who:"Abdullah", n:"Detailed transactions, not just balance — 6 months before application."},
    {id:"f2", t:"Employment Detail Summary + 3 recent payslips", who:"Abdullah", n:"Shows income above threshold for one child."}
  ]},
  { id:"other", title:"Other", items:[
    {id:"o1", t:"Details of any previous visa refusals", who:"Both", n:"Include original refusal letter if applicable."},
    {id:"o2", t:"Medical/travel insurance", who:"Ayesha", n:"Not needed at submission, have ready before travel."}
  ]}
];

const API_BASE = "https://visa-files-api.ranakaharian1.workers.dev";
const TOKEN_KEY = "familyVisaDriveToken_v1";
let sessionToken = localStorage.getItem(TOKEN_KEY) || "";
let currentUser = localStorage.getItem("familyVisaDriveUser_v1") || "";
let state = {};
let activeCat = DATA[0].id;
let activeItem = null;
let previewIdx = 0;
let zoom = 1;
const isMobile = () => window.innerWidth <= 900;

function api(path, options={}){
  if (!API_BASE.startsWith('http')) throw new Error('Cloudflare Worker URL has not been added to index.html yet.');
  const headers = new Headers(options.headers || {});
  if (sessionToken) headers.set('Authorization','Bearer '+sessionToken);
  return fetch(API_BASE.replace(/\/$/,'') + path, {...options, headers});
}
function categoryForItem(id){ for(const s of DATA) if(s.items.some(i=>i.id===id)) return s.id; return ''; }
function isDone(id){ return !!(state[id]?.files?.length); }
function counts(sec){ const total=sec.items.length; const done=sec.items.filter(it=>isDone(it.id)).length; return {total,done}; }
function findItem(id){ for (const s of DATA) for (const it of s.items) if (it.id===id) return it; }
function fileUrl(id){ return API_BASE.replace(/\/$/,'') + '/file/' + encodeURIComponent(id); }

async function syncCloud(showStatus=true){
  if (!sessionToken) return false;
  const status=document.getElementById('cloudStatus');
  if(showStatus){status.textContent='↻ Syncing';status.classList.remove('bad');}
  try{
    const r=await api('/sync');
    if(r.status===401){ logout(false); return false; }
    if(!r.ok) throw new Error((await r.json()).error||'Sync failed');
    const d=await r.json();
    state={};
    for(const [id,files] of Object.entries(d.items||{})) state[id]={files};
    currentUser=d.user||currentUser;
    localStorage.setItem('familyVisaDriveUser_v1',currentUser);
    document.getElementById('avatarHdr').textContent=(currentUser||'A')[0];
    status.textContent='☁ Shared';status.classList.remove('bad');
    renderAll();
    return true;
  }catch(e){status.textContent='⚠ Offline';status.classList.add('bad'); console.error(e); return false;}
}
function logout(clear=true){ if(clear){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem('familyVisaDriveUser_v1');} sessionToken='';currentUser='';document.getElementById('authOverlay').classList.remove('hidden'); }

async function login(){
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginError');
  btn.disabled=true;btn.textContent='Signing in…';err.textContent='';
  try{
    const user=document.getElementById('loginUser').value;
    const password=document.getElementById('loginPassword').value;
    const r=await fetch(API_BASE.replace(/\/$/,'')+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,password})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Sign in failed.');
    sessionToken=d.token;currentUser=d.user;localStorage.setItem(TOKEN_KEY,sessionToken);localStorage.setItem('familyVisaDriveUser_v1',currentUser);
    document.getElementById('authOverlay').classList.add('hidden');document.getElementById('loginPassword').value='';
    await syncCloud();
  }catch(e){err.textContent=e.message;}
  finally{btn.disabled=false;btn.textContent='Sign in';}
}

document.getElementById('loginBtn').onclick=login;
document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

function renderSidebar(){
  const el=document.getElementById('sidebar'); let total=0,done=0; DATA.forEach(sec=>{const c=counts(sec);total+=c.total;done+=c.done;}); const pct=total?Math.round(done/total*100):0;
  el.innerHTML=`<div class="summary-card"><div class="summary-top"><div><div class="summary-kicker">Application progress</div><div class="summary-title">Family visa pack</div></div><div class="summary-value">${pct}%</div></div><div class="summary-bar"><span style="width:${pct}%"></span></div></div>`+DATA.map(sec=>{const c=counts(sec);return `<button class="cat ${sec.id===activeCat?'active':''}" data-cat="${sec.id}"><span class="ic">${CAT_ICON[sec.id]}</span>${sec.title}<span class="n">${c.done}/${c.total}</span></button>`}).join('');
  el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;activeItem=null;setView('list');renderAll();});
}
function rowHtml(it){const files=state[it.id]?.files||[];const done=files.length>0;return `<div class="row ${done?'done':''} ${it.id===activeItem?'selected':''}" data-item="${it.id}"><input type="checkbox" ${done?'checked':''} disabled title="Completed automatically when a file is uploaded"><div class="av" style="background:${WHO_COLOR[it.who]}">${it.who[0]}</div><div class="body"><span class="who" style="color:${WHO_COLOR[it.who]}">${it.who}</span><span class="rt">${it.t}</span>${it.n?`<span class="rn">${it.n}</span>`:''}</div>${files.length?`<span class="clip">📎${files.length>1?files.length:''}</span>`:''}</div>`;}
function renderList(){const el=document.getElementById('listPane');const q=(document.getElementById('searchInput')||{}).value?.trim().toLowerCase();if(q){const m=[];DATA.forEach(sec=>sec.items.forEach(it=>{if((it.t+' '+it.n).toLowerCase().includes(q))m.push(it)}));el.innerHTML=`<div class="list-title">Search results</div>`+(m.length?m.map(rowHtml).join(''):`<div class="empty">No documents match "${q}".</div>`)}else{const sec=DATA.find(s=>s.id===activeCat),c=counts(sec),pct=c.total?Math.round(c.done/c.total*100):0;el.innerHTML=`<div class="list-head"><div class="list-title">${sec.title} · ${c.done}/${c.total}</div><div class="mini-progress"><span style="width:${pct}%"></span></div></div>`+sec.items.map(rowHtml).join('')}el.querySelectorAll('[data-item]').forEach(r=>r.onclick=()=>{activeItem=r.dataset.item;previewIdx=0;zoom=1;setView('reader');renderAll();});}
async function openPreview(file){
  const headers={'Authorization':'Bearer '+sessionToken}; const r=await fetch(fileUrl(file.id),{headers}); if(!r.ok) throw new Error('Could not open file.'); return URL.createObjectURL(await r.blob());
}
function renderReader(){
  const el=document.getElementById('readerPane');if(!activeItem){el.innerHTML='<div class="empty"><span class="empty-icon">📄</span><strong>Select a document</strong><br>Upload, preview and organise each item here.</div>';return;}
  const it=findItem(activeItem),files=state[activeItem]?.files||[];if(previewIdx>=files.length)previewIdx=0;const cur=files[previewIdx];
  const chips=files.map((f,i)=>`<span class="fchip ${i===previewIdx?'sel':''}" data-preview="${i}">${f.name}<button data-rm="${f.id}" title="Delete from shared Drive">×</button></span>`).join('');
  const sample=it.sample?`<div class="sample"><span class="lbl">Draft letter — fill in, print & sign</span><textarea readonly>${it.sample}</textarea></div>`:'';
  el.innerHTML=`<div class="reader-head"><div><h2 class="r-title">${it.t}</h2><div class="r-note">${it.n||'Add the supporting document for this checklist item.'}</div></div><span class="owner-pill" style="color:${WHO_COLOR[it.who]}">● ${it.who}</span></div>${sample}<div class="upload-zone"><div class="upload-copy"><div class="upload-title">${files.length?'Add another shared document':'Upload shared document'}</div><div class="upload-sub">Saved in Google Drive and visible to both of you.</div></div><label class="btn primary">＋ Choose file<input type="file" id="upInput" accept="image/*,.pdf" multiple></label></div>${files.length?`<div class="chips">${chips}</div><div class="saved-note">✓ ${files.length} shared file${files.length>1?'s':''}</div>`:''}<div class="warn" id="warnMsg" style="display:none"></div><div id="cloudViewer">${cur?`<div class="file-card"><div class="file-icon">${(cur.type||'').includes('pdf')?'📕':'📎'}</div><div class="file-meta"><div class="file-name">${cur.name}</div><div class="file-type">Uploaded by ${cur.uploadedBy||'family'}${cur.createdTime?' · '+new Date(cur.createdTime).toLocaleDateString():''}</div></div><button class="btn" id="openCloudFile">Open</button></div>`:''}</div>`;
  document.getElementById('upInput').onchange=async e=>{const picked=[...e.target.files];if(!picked.length)return;const warn=document.getElementById('warnMsg');warn.style.display='block';warn.style.color='var(--green)';try{for(const file of picked){warn.textContent=`Uploading ${file.name}…`;const cat=categoryForItem(activeItem);const r=await api(`/upload?category=${encodeURIComponent(cat)}&item=${encodeURIComponent(activeItem)}&name=${encodeURIComponent(file.name)}`,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','X-File-Name':file.name,'X-Content-Type':file.type||'application/octet-stream'},body:file});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed.');}warn.textContent='✓ Uploaded to Google Drive';await syncCloud(false);}catch(ex){warn.style.color='var(--orange)';warn.textContent=ex.message;}};
  el.querySelectorAll('[data-preview]').forEach(c=>c.onclick=e=>{if(e.target.matches('[data-rm]'))return;previewIdx=+c.dataset.preview;renderReader();});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('Delete this file from the shared Google Drive folder?'))return;const r=await api('/file/'+encodeURIComponent(b.dataset.rm),{method:'DELETE'});const d=await r.json();if(!r.ok){alert(d.error||'Delete failed.');return;}previewIdx=0;await syncCloud(false);});
  const open=document.getElementById('openCloudFile');if(open&&cur)open.onclick=async()=>{open.disabled=true;open.textContent='Opening…';try{const u=await openPreview(cur);const target=document.getElementById('cloudViewer');if((cur.type||'').startsWith('image/'))target.innerHTML+=`<div class="viewer" style="margin-top:10px"><img style="max-width:100%;height:auto" src="${u}"></div>`;else if((cur.type||'').includes('pdf'))target.innerHTML+=`<div class="viewer" style="margin-top:10px"><iframe class="pdf-view" src="${u}#toolbar=0"></iframe></div>`;else window.open(u,'_blank');}catch(ex){alert(ex.message)}finally{open.disabled=false;open.textContent='Open'}};
}
function renderProgress(){const v=document.getElementById('main').dataset.view;if(v==='list'||v==='reader'){const c=counts(DATA.find(s=>s.id===activeCat));document.getElementById('progressLabel').textContent=`${c.done}/${c.total}`}else{let total=0,done=0;DATA.forEach(sec=>{const c=counts(sec);total+=c.total;done+=c.done});document.getElementById('progressLabel').textContent=`${done}/${total} overall`;}}
function setView(v){document.getElementById('main').dataset.view=v;document.getElementById('headerTitle').textContent=v==='cats'?'Ireland Join Family Visa':v==='list'?DATA.find(s=>s.id===activeCat).title:(activeItem?findItem(activeItem).t:'Family Docs');renderProgress();}
document.getElementById('backBtn').onclick=()=>{const v=document.getElementById('main').dataset.view;if(v==='reader')setView('list');else if(v==='list')setView('cats');};
function renderAll(){renderSidebar();renderList();renderReader();renderProgress();}
document.getElementById('searchInput').addEventListener('input',()=>{if(isMobile())setView('list');renderList();});

async function downloadAllPdf(){
  const btn=document.getElementById('dlAllBtn'),original=btn.textContent;btn.disabled=true;btn.textContent='Building…';
  try{if(!window.PDFLib)throw new Error('PDF library did not load.');const {PDFDocument,StandardFonts,rgb}=PDFLib;const merged=await PDFDocument.create();const font=await merged.embedFont(StandardFonts.HelveticaBold);let count=0;
    for(const sec of DATA)for(const it of sec.items){const files=state[it.id]?.files||[];if(!files.length)continue;const label=merged.addPage([595,120]);label.drawText(sec.title.toUpperCase(),{x:40,y:80,size:11,font,color:rgb(.36,.34,.31)});label.drawText(`${it.t} — ${it.who}`,{x:40,y:50,size:13,font,color:rgb(.13,.13,.11)});for(const f of files){const r=await fetch(fileUrl(f.id),{headers:{Authorization:'Bearer '+sessionToken}});if(!r.ok)continue;const buf=await r.arrayBuffer();const type=f.type||'';if(type.includes('pdf')){const src=await PDFDocument.load(buf);const pages=await merged.copyPages(src,src.getPageIndices());pages.forEach(p=>merged.addPage(p));}else if(type.includes('png')||type.includes('jpeg')||type.includes('jpg')){const img=type.includes('png')?await merged.embedPng(buf):await merged.embedJpg(buf);const scale=Math.min(595/img.width,842/img.height,1),w=img.width*scale,h=img.height*scale;const page=merged.addPage([595,842]);page.drawImage(img,{x:(595-w)/2,y:(842-h)/2,width:w,height:h});}}count++;}
    if(!count)throw new Error('No documents uploaded yet.');const bytes=await merged.save();const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download='Family-Visa-Documents.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent=original;}}
document.getElementById('dlAllBtn').onclick=downloadAllPdf;

setView(isMobile()?'cats':'reader');renderAll();
if(sessionToken){document.getElementById('authOverlay').classList.add('hidden');syncCloud();}

</script>
